# ci/packages.toml — the texlive-packages build registry.
#
# Consumed by ci/matrix.py (build selection). One table per package; **a
# package without an entry is not built**. The specs themselves live in
# pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# All packages are batch 5: the GENERATED TeX Live groups (specs written by
# tools/texlive-splitter from a tlnet snapshot — do not edit by hand).
# Rolled biweekly by texlive-update.yml; never swept (no [pkg.updates]
# tables by design, so there is no update.yml in this repo).

# --------------------------------------------------------------- groups

# --- batch 5 (all generated groups, one wave) ----------------------------
[texlive-basic]
batch = 5

[texlive-bibtexextra]
batch = 5

[texlive-binextra]
batch = 5

[texlive-fontsrecommended]
batch = 5

[texlive-fontutils]
