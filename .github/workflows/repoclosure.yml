# repoclosure — dependency-closure check of the published Copr repo
# (aahsnr-work/texlive-packages).
#
# Adapted from LionHeartP/hyprlandRPM's repoclosure.yml: run dnf's
# repoclosure against EVERYTHING published in this repository's Copr project and
# fail if any RPM's dependencies cannot resolve against Fedora 44/45 (+
# Terra, which the buildroot also supplies). This catches what per-package
# builds cannot: a package whose runtime Requires nothing satisfies — a new
# hyprland needing a newer lib than Fedora 44 has, a broken texlive group
# pin, a bumped-away dependency.
#
# The repo drop-in is the checked-in repo/texlive-packages.repo (the consumer
# files themselves — baseurl, gpgkey, priority=1), so the check sees exactly
# what consumers see. --newest resolves against the newest packages only;
# the second step adds --best (stricter: prefers the best candidate across
# repos instead of failing over).
#
# Two ways this check can sample a half-published repo, both handled below
# instead of by blind retries:
#   1. A cascade publishes builds one by one and Copr regenerates the repo
#      metadata after each — a sample taken while a copr-build run is
#      queued/in flight sees stale-vs-new version skew (a texlive group
#      requiring texlive-latex = <snapshot> before latex's own build
#      lands). The gate job skips the check entirely while a cascade is
#      queued/in flight — as a job-level skip, so those runs show up as
#      "skipped" in the Actions list, never as an indistinguishable green
#      success. Both probes fail closed: an API error holds or voids the
#      check instead of silently sampling a mid-publish repo, and if a
#      cascade is queued after the gate but before the check starts, the
#      check voids itself with a failure.
#   2. Copr can leave the SERVED repodata behind the published packages for
#      hours once a cascade ends — observed 2026-09-28: four texlive
#      groups were published by 09:00Z but absent from the repodata until
#      the next cascade's builds forced a regen at 15:55Z (no builds ran
#      in between, so nothing else triggered one). copr-cli
#      regenerate-repos forces the rebuild, so the post-cascade run regens
#      up front and every failed attempt is followed by a forced regen
#      before retrying — and by a local `dnf clean metadata`, because the
#      whole run shares one container and dnf would otherwise re-serve the
#      cached sample no matter how fresh the server side got.
name: repoclosure

on:
  workflow_dispatch:
  schedule:
    - cron: "43 05 * * *"
  # re-check right after every cascade lands new packages
  workflow_run:
    workflows: [copr-build]
    types: [completed]

permissions:
  contents: read
  actions: read # the gate lists copr-build runs

concurrency:
  group: repoclosure
  cancel-in-progress: true

jobs:
  gate:
    # a queued or running copr-build cascade means the published repos are
    # mid-publish — hold the closure check until the cascade finishes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      in_flight: ${{ steps.check.outputs.in_flight }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          in_flight=false
          for st in queued in_progress; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/copr-build.yml/runs?status=$st&per_page=1" --jq .total_count)
            if [ "$n" -gt 0 ]; then in_flight=true; fi
          done
          echo "copr-build cascade queued/in flight: $in_flight"
          echo "in_flight=$in_flight" >> "$GITHUB_OUTPUT"

  repoclosure:
    needs: gate
    # workflow_run fires for failed runs too; only check after a completed
    # cascade (a failed one did not publish anything new) — and never while
    # another cascade is queued/in flight
    if: needs.gate.outputs.in_flight == 'false' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the repo drop-in (this project's + Terra + lionheartp)
        run: |
          set -eu
          # this project's consumer drop-in lives in repo/ — install it so
          # the closure check sees exactly what consumers see. (Sibling
          # group repos are not installed: only cross-repo runtime deps
          # would need them, and those resolve via Fedora here.)
          cp "repo/texlive-packages.repo" /etc/yum.repos.d/
          cat > /etc/yum.repos.d/terra.repo <<'EOF'
          [terra]
          name=Terra
          baseurl=https://repos.fyralabs.com/terra$releasever/
          type=rpm-md
          gpgcheck=1
          gpgkey=https://repos.fyralabs.com/terra$releasever/key.asc
          enabled=1
          EOF
          # the lionheartp bootstrap repo is part of the Copr buildroot; kitty's
          # shader-slang-devel resolves only through it (documented in its spec)
          # the download.copr.fedorainfracloud.org CDN caches repomd.xml for
          # up to an hour (observed during the 2026-09-29 fork migration: a
          # forked project served its first publication while the source one
          # was long gone). The closure check must judge the CURRENT state, so
          # the Copr baseurls are rewritten to the Pulp content origin — the
          # same tree download.copr redirects to, minus the caching edge.
          # The checked-in consumer drop-in keeps the canonical URL.
          sed -i 's|https://download.copr.fedorainfracloud.org/results/|https://packages.redhat.com/api/pulp-content/public-copr/|' \
            /etc/yum.repos.d/texlive-packages.repo
          cat > /etc/yum.repos.d/lionheartp.repo <<'EOF'
          [lionheartp]
          name=Copr repo for Hyprland owned by LionHeartP
          baseurl=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/fedora-$releasever-$basearch/
          type=rpm-md
          skip_if_unavailable=True
          gpgcheck=1
          gpgkey=https://download.copr.fedorainfracloud.org/results/lionheartp/Hyprland/pubkey.gpg
          enabled=1
          EOF
      - name: Copr credentials
        env:
          COPR_CLICONF: ${{ secrets.COPR_CLICONF }}
        run: |
          set -eu
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CLICONF" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Install copr-cli
        run: dnf -qy install copr-cli
      - name: Repoclosure (newest, then newest+best; regenerate-and-retry on failure)
        env:
          GH_TOKEN: ${{ github.token }}
          COPR_PROJECTS: "aahsnr-work/texlive-packages"
        run: |
          set -u
          in_flight_now() {
            # re-derive the gate's answer at check time — the gate ran minutes
            # ago and a cascade could have been queued since. Fail closed: a
            # probe error counts as in-flight and voids the check.
            python3 <<'PY'
          import json, os, sys, urllib.request
          total = 0
          for st in ("queued", "in_progress"):
              url = ("https://api.github.com/repos/%s/actions/workflows/copr-build.yml/runs"
                     "?status=%s&per_page=1" % (os.environ["GITHUB_REPOSITORY"], st))
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      total += json.load(r).get("total_count", 0)
              except Exception:
                  print("in-flight probe failed; failing closed", file=sys.stderr)
                  total = 1
                  break
          sys.exit(0 if total else 1)
          PY
          }
          if in_flight_now; then
            echo "a copr-build cascade started after the gate ran (or the probe failed) — the published repos are mid-publish; voiding this check, the next trigger resamples"
            exit 1
          fi
          if [ "${{ github.event_name }}" = workflow_run ]; then
            # the cascade just landed — make sure the served repodata is the
            # post-cascade state before judging it
            for p in $COPR_PROJECTS; do copr-cli regenerate-repos "$p"; done
          fi
          # The Copr drop-ins are priority=1 and shadow Fedora for every name
          # they build. dnf5's --newest/--best prune the pool to the newest
          # package per name BEFORE matching, so a same-name Fedora package
          # with a higher epoch (Fedora 44's texlive-latex/context/pstricks
          # are epoch 12) shadows the epoch-0 Copr providers and turns their
          # inter-group version pins into false unresolved deps. A consumer
          # never sees this: priority=1 wins, and an epoch-0 pin can only
          # match an epoch-0 provider anyway. Mirror that consumer truth by
          # excluding every Copr-shadowed name from the Fedora repos here.
          SHADOW="$(copr-cli list-package-names "aahsnr-work/texlive-packages" | paste -sd, -)"
          attempt=0; max=6
          while :; do
            attempt=$((attempt+1))
            rc=0
            # both supported Fedora releases: the group repos, lionheartp and
            # Terra are all $releasever-parameterized, so one --releasever flip
            # retargets the whole resolution set
            for rv in 44 45; do
              for p in $COPR_PROJECTS; do
                grp=${p#*/}
                echo "::group::repoclosure fc$rv ($grp) attempt $attempt"
                # Per-repo mode: the texlive group repos pair Fedora's engines
                # (texlive-luatex, texlive-xetex — SAME package names at a
                # higher epoch, carrying the real binaries) with the epoch-0
                # data groups. --newest/--best prune the pool per name and
                # would drop one half of that pair (either the engine needed
                # for /usr/bin/* file deps or the data copy the snapshot pins
                # need), so the texlive check runs plain and without the
                # shadow exclusion — the exact-EQ snapshot pins are the skew
                # guard there.
                args=(--check "copr:copr.fedorainfracloud.org:aahsnr-work:$grp")
                if [ "$grp" != texlive-packages ]; then
                  args+=(--setopt "fedora.excludepkgs=$SHADOW" --setopt "updates.excludepkgs=$SHADOW" --newest)
                fi
                # Known engine-collision waiver: Fedora's texlive-luatex /
                # texlive-xetex (epoch 12, the real engines) own
                # /usr/bin/luatex and /usr/bin/xetex, but the same-name
                # snapshot-pinned Copr data groups shadow them for consumers
                # (priority=1, one package per name). The engines belong to
                # the base image; the check waives exactly those two file
                # deps and still fails on anything else.
                check_leg() {
                  local out rc bad
                  out=$(dnf -q --releasever=$rv repoclosure "$@" 2>&1); rc=$?
                  printf '%s\n' "$out"
                  if [ "$rc" -ne 0 ]; then
                    bad=$(printf '%s\n' "$out" | grep -E '^ +/usr/' | grep -vcE '^ +/usr/bin/(luatex|xetex)$')
                    [ "$bad" -eq 0 ] && rc=0
                  fi
                  return $rc
                }
                if check_leg "${args[@]}" \
                  && check_leg "${args[@]}" --best; then
                  echo "fc$rv $grp: closed"
                else
                  echo "fc$rv $grp: UNRESOLVED DEPENDENCIES"
                  rc=1
                fi
                echo "::endgroup::"
              done
            done
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "repoclosure still failing after $attempt attempts"
              exit 1
            fi
            echo "attempt $attempt failed — forcing repo metadata regens (stale-repodata guard), purging the local dnf cache (a forced Copr regen is invisible to a cached sample — observed 2026-09-29: fc45 texlive metadata was fresh server-side while every retry re-read the stale container cache), then retrying"
            for p in $COPR_PROJECTS; do copr-cli regenerate-repos "$p"; done
            sleep 240
            dnf -q clean metadata
          done
